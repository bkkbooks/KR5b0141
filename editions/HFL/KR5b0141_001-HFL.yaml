body:
  text: 太上洞玄靈寳智慧罪根上品大戒經卷上太上道君時於南丹洞陽上館柏陵舍稽首禮問元始天尊自顧宿世福慶因緣億劫運通得㑹聖明昔蒙顯擢過忝上眞加見訓喻三寳神經賜以大戒吿以法音過泰之歡實爲無量自受訓勵長齋空山尊承法戒不敢怠倦道業成就開度天人一切男女普見法門年命長逺國土安全翫樂之心志在不退旣蒙開悟願卒未聞不審智慧宿命罪根靈音祕重可得暫盼篇目不乎如蒙哀憐重賜戒言則以幽夜披太陽之光長劫苦魂得蒙拔度更生福堂道濟無外惠宜普隆所陳曲辟懼觸天顔顒顒之心實希恩造元始天尊是時當授太上道君智慧罪根上品戒經五老上帝大聖尊神十方至眞諸天上仙玄和玉女五萬二千五百衆詣座天灑香華神龍妓樂無鞅數衆天仙玉女手把十絶靈旛旋繞日月華精神風四會流香拂塵紫雲吐暉絳霞敷天三景齊照諸天光明河海靜黙山嶽藏煙龍螭踊躍人神歡欣生死同休福慶普隆五苦咸解三徒並原長離地獄更生天堂一切衆生並得長年於是天尊命召十方飛天神人開九幽玉匱長夜之函出生死罪録惡對種根十方飛天各說因縁以吿太上大道君焉天尊吿曰龍漢之年我出法度人其世愚聾不知法音唯用純朴無有惡心不識禮義無有君臣不識宿命不知因緣以法訓喻漸入法門專心信向無爲罪根命皆長逺不有夭傷我過去後天地破壞無復光明男女灰滅淪於延康幽幽冥冥億劫之中至赤明開光天地復位我又出世號無名之君出法教化度諸天人其世男女行有精麤不等一心有信向者皆得長年有生嫉害惡逆不忠皆夭壽命便有罪福因緣之根我過去後一劫交周天地又壞復無光明幽幽冥冥五劫之中至開皇元年靈寳眞文開道三象天地復正五文煥明我於始青天中號元始天尊流演法教化度諸天始開之際人民純朴結繩而行混沌用心合於自然皆得長壽三萬六千年至上皇元年心漸頽壞恐至凋落正法不全故國國周行宣授天文咸令入法成就諸心半劫之中命漸凋落壽得一萬八千餘年我過去後天運轉促人心破壞更相謀逆嫉害勝己爭競功名不信經法疑貳天眞口是心非自作一法淫祀邪神殺生祈禱迷惑不專更相殘害自取夭傷命不以理壽無定年致有罪録惡種展轉五道八難之中沈淪三徒莫知命根冥冥長夜億劫無還流曳塗炭甚可哀傷今當相告治身之戒功德報應罪惡之對生死命根便可諦受愼行勿忘廣宣開度普示天人咸令男女歸身法門持戒修齋逺諸惡源使生死歡泰得道自然道君歡喜伏聽戒言天尊言曰夫欲安身治國使門户清貴天神祐護地祇敬愛當修善功勤心齋戒廣施法門先人後身有惠於萬物功普於一切功滿三千白日昇天修善有餘天降雲車弘道無巳自致不死斯本行之上戒可不遵奉之乎一者當䘏死護生救度戹難命得其壽不有夭傷二者救疾治病載度困篤身得安全不有痛劇三者施惠窮困拯度危戹割已濟物無有恡惜四者奉侍師寳營靖建舍廣作功德無有怠倦五者書經校定晨夕禮誦供養香燈心無替慢六者修齋念道恭心遵法内外清虚不生穢惡七者退身護義不爭功名抱素守朴行應自然八者宣化愚俗諫諍解惡咸令一心宗奉大法九者邊道立井植種果林敎化童蒙勸人作善十者施爲可法動靜可觀敎制可軌行常使然此十善因縁上戒之律十天神王所奉能行之者飛天齊功次當持身愼行與人君言則惠於國與人父言則慈於子與人師言則愛於衆與人兄言則悌於行與人臣言則忠於君與人子言則孝於親與人友言則信於交與人婦言則貞於夫與人夫言則和於室與人弟子言則恭於禮與野人言則勸於農與道士言則正於道與異國人言則各守其域與奴婢言則愼於事此一十四戒持身之品四天帝王常所宗奉普吿四方正士神祇人民百姓子男女人咸使行此上品參於四天自然福堂能行之者四天所貴地祇所稱位比仙王次有上品百八十戒中品八十戒下品四十戒並元始智慧三品之律撰爲觀身大戒合三百首自非上仙之德身洞三清體入自然莫能奉之末世男女心當破壞行漸怠縱並懷疑貳趣競萬端守眞者少必當不能宗承觀身旣不遵奉必致大殃今撰上品十戒之律可以度人廣加開化令入法門勤奉之者則獲自然之福無爲之道也十戒者一者不得嫉妬勝己抑絶賢明二者不得飲酒放蕩穢亂三宮三者不得淫犯他妻好貪細滑四者不得棄薄老病窮賤之人五者不得誹謗善人毀攻同學六者不得貪積珍寳弗肯施散七者不得殺生祠祀六天鬼神八者不得意論經無以爲虚誕九者不得背師恩義欺詐新學十者平等一心仁孝一切此十戒普教十方無極世界度一切人能奉之者功書十天福延七祖拔出長夜九幽之中上昇南宮身入光明因縁不絶剋得神仙諸行並足當避十惡逺於盲道斷滅罪根十惡者一者飲酒淫色貪欲無巳二者隂賊世間訕謗道士三者輕師慢法傲忽三寳四者𥨸取經書妄宣道要五者借換不還欺誘萬民六者殺生貪味口是心非七者不孝背恩違義犯諸禁忌八者誦經忽略嗊嗃自是九者責望人意嗔恚四輩十者意斷經旨損益聖典不信宿命快情恣爲穢慢四大不念生道此十惡之戒不能離身犯之者身遭衆横鬼神害命考楚萬痛恒無一寜履善遇惡萬向失利死入地獄幽閉重檻長夜之中不覩三光晝夜流曵抱銅柱履刀山循劒𣗳入鑊湯吞火食炭五苦備經長淪九幽無有生期縱得解脫還生六畜之中不得人道惡惡相牽善善相因罪福之對如日月之垂光生死之不滅如影之隨形縁轉相加如車之輪今說是戒護度天人明識諦受勤行勿忘若清信士女必能保持十戒才力兼贍欲勤行精進廣施衆善者可授十二可從開示十善十四持身之品也天尊言夫爲學者修齋求道開度天人作諸善功當行十二可從戒而得度世者爾宜從之自得正眞終入無爲所願皆成十二可從戒者一者見眞經正法開度一切便發道意心願後世得登大聖二者常行慈心願念一切普得見法開度廣逺無有障礙三者好樂經教深逺覽逹意志堅明開化愚闇四者遵受師訓廣開勸化令入法牆逺離盲道五者信向玄妙尊奉經訣晨夕誦習無有怠倦六者不務榮華斷絶因緣專心定志所營在法七者勤誦大經願念一切廣開橋梁爲來生作善縁八者恒生善心不邪不僞無嫉無害無惡無妬九者在所隨生常值聖世興靈寳法教相值不絶十者潔身持戒修齋建功廣救羣生咸得度脫十一者學業廣覽宣通同法預以天人普令開度十二者常與明師世世相值受教宣化度人無量一切善心皆得道眞天尊言夫學士治行之法當行十二可從之戒能以一心行此善念世世得見聖與道結緣諸天友識獨歩三界無所罣礙長離三惡五道八難神明敬護地祇擁衛門戸清肅萬災不干可謂端坐而得道也勤爲習誦廣宣同學皆使一切齊入法門是時天尊說戒都畢太上道君十方至眞無極大聖高玄眞人歡喜作禮一時東向稽首伏地太上道君前進長跪上白天尊言衆眞侍坐得聞法音諸天踊躍喜慶難勝大法旣興普度天人來生男女當受此恩然見世愚聾未見命根不知罪福所從何來雖加開悟不信者衆巳垂訓喻願卒皇恩普賜十方無極世界百姓子男女人同時開悟得見宿命善惡因緣罪福報應知有命根普天獲濟法教日隆於是天尊放身威光内外洞徹照明十方無幽無隱無極無窮一時曉明如見眼前是男是女悉是諸天之上福堂善人逍遥無爲歡樂自然下見諸地九幽之府長夜之中囚徒作役餓鬼畜生流曵死魂首體髠截無復身形幽閉重檻不覩三光百姓男女並見命根罪福緣對善惡之報莫不震惶一時歸心宗奉大法修行衆善投命天尊伏從禁戒無復退轉福德普帀歡樂難言不勝喜慶諸天大聖莫不稱善故作頌曰十天輪空洞死生從中歸善惡各生根緣對初無虧昔見清信士故得十天飛歷觀九幽夜苦魂攀嶺悲長河難閉塞刀山不可迴輪轉五道中惻愴傷人懷天尊說禁戒朗朗長夜開諸天並歡悅斯樂難可偕天尊言今當命使諸天神人說諸罪錄宣通法音開悟羣生覺諸天人善男子善女人令知身行罪惡命根因緣不絶殃對相尋流曵三塗五道之中魂形苦惱億劫無還故說是戒令入法門開度九幽拔出苦根使生者見道身脫八難死者歡樂上昇天堂早生人中轉輪聖王生死慶泰世世長存預以信向皆當精心奉戒持齋自得道眞愼行勤修諦受勿忘能同大法便當伏聽太上洞玄靈寳智慧罪根上品大戒經卷上
