  text: 太上洞玄靈寶智慧罪根上品大戒經卷下東極世界飛天神人曰東方無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功滿福報致得乘空白日飛行駕景策龍上登玉清遊行東極九氣天中未得道者生世富貴位為人尊年命長逺並無夭傷東方青帝皆即列名奏言九氣上天九氣天官告下東方三官九署地牢之中削落青元九幽玉匱長夜之函宿世罪根青天司命勤録諸天神仙簿中七祖皆得上升天堂衣食自然隨年更生帝王之門世世歡樂恆居福中因緣不絶故得信根太上道君顧問東極世界飛天神人曰我嘗歷觀諸天出遊東門見東方無極世界地獄之中有百姓子男女人身受考撻諸痛備嬰形體毀悴苦毒難言見之悲傷謫役幾年當得解脫為還人中更還惡緣如此之輩當作何功德以拔此怨使得開度還入善門東極世界飛天神人曰其人所犯元惡罪録結在九幽長夜之函九氣天君青天靈官三界司算結其目録依玄都女青上宮左官律九萬劫得還生非人之道輪轉九億萬劫天地數極乃得作九河都役使此之辛苦非可能言欲得開度斷絶惡緣當依明真玉匱女青上宮科品以青紋之繒九十尺亦可九尺金龍一枚詣東方九氣天君東鄉諸靈官九幽之中拔贖苦魂絶諸罪根九日九夜明燈燒香首謝天君九幽之下得見光明可得解脫還入善緣九年皆得還生人中世世歡樂福慶無窮東南世界飛天神人曰東南無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功滿福報名書上清或位登上聖或為神仙遊行五嶽駕龍乘虛見在世上為人師宗萬姓所仰三界所敬門戶清貴福慶無窮東南地司皆列名上言梵氣上天梵氣天官告下東南三官九府百二十曹削落黃元九幽玉匱長夜之函宿世罪根梵天司命勒録梵天神仙籍中七祖普得去離三塗上升天堂衣飯天廚一十二年皆得更生福德之門帝王之家世世歡樂輪轉因緣遂得飛仙太上道君顧問東南世界飛天神人曰我嘗歷觀諸天出遊東南門見東南無極世界地獄之中有百姓子男女人受此惡對苦毒難言見之悲傷甚可哀愍被責幾年當得解脫蒙赦之日為生人中為作何形如此之輩有何功德可相解度東南世界飛天神人曰斯人所行罪在酷逆結於九幽長夜之函一氣天君梵氣諸靈官三界司算結其罪録依玄都女青中宫中官律萬劫得還生賤人之中身嬰六極或抱殘傷或生棄疾輪轉十二萬劫無數之周乃得作東嶽都役使其人艱辛非可能言欲得拔度還於善緣當依明真玉匱女青中宫科品以黃文之繒一百二十尺亦可一十二尺金龍一枚詣東南梵氣天君東南諸靈官九幽之中拔贖罪魂一十二日一十二夜明燈燒香首謝天君可得開度見諸光明一十二年皆得還生福德之門世世歡樂永享無窮南方無極世界飛天神人曰南方無極世界恆沙衆生已得道過去及未得道見在福中善男子善女人修奉智慧一品十戒功滿德備丹天福報巳得道者位登上真或為神仙或為靈官或得滅度見在世上聰明智慧逆知吉凶或通靈徹視役使鬼神或在富貴帝王之門南方赤帝南極地司皆列名上言三氣丹天三氣天官告下南方三官九府百二十曹削除赤元九幽玉匱長夜之函宿世罪根丹天司命注上丹天神仙籍中七祖普得去離三塗上升天堂逍遙南宫三年皆得更生福德之門世世歡樂福慶難稱善緣不絶尅得神仙太上道君顧問南極世界飛天神人曰我嘗歷觀諸天出遊南門見南方無極世界地獄之中有百姓子男女人祼身無衣吞火食炭頭面焦燎舉體爛壞無復人形身受惡對苦毒難言見之流曵傷痛人心如此之輩受對幾年當得解脫被赦之日為還人中為作何形大慈之法有何功德可得解度還於善緣南極世界飛天神人曰其人酷逆生世不道罪結九幽長夜之府三氣天君丹天諸靈官三界司算結其罪録依玄都女青陽宫太陽官律罪役皆三萬劫當還生六畜之中以報宿怨三百萬劫輪轉丹天數周乃得作三河水曹都役使其間辛苦非可得言若欲開度斷諸惡緣使得速還人道之中當依明真玉匱女青陽宫科品以絳紋之繪三十尺亦可三尺金龍一枚詣南方三氣天君南鄉諸靈官九幽之中拔贖罪魂三日三夜明燈燒香首謝天君可得速出長夜之中見諸光明三年皆得更生人中因緣不絶轉得信根西南世界飛天神人曰西南無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功德滿足身受福報巳得道者位登上真未得道者見在世上為地祇所稱天神所敬死升南官受號上輔天官總領鬼神西南梵氣天君告下西南地祇三官九府百二十曹削落黃元九幽玉匱長夜之函宿世罪根梵天司命勒録梵天神仙簿中九祖普得去離三塗五苦之中升度南宫逍遙福堂後十二年皆得還生富貴之門因緣不絶遂得神仙太上道君顧問西南世界飛天神人曰我嘗歷觀諸天出遊西南門見西南無極世界長夜地獄三河九江五嶽之中有百姓子男女人身受惡對苦痛難勝見之悲惻傷人肝心如此之輩凡應幾年當得解脫被赦之日當作何形有何功德可得拔度還入福中西南世界飛天神人曰此人前身十生人道恆無善行生輒元逆一氣天君梵氣諸靈官三界主司結其罪録依玄都女青下宮右官律萬劫得還生下人之身作僕使輪轉十二萬劫無數之周乃得作南河都役使此之勤苦非言所盡欲使拔度還於善緣當依明真玉匱女青下宮科品以黃紋之繪一百二十尺亦可一十二尺金龍一枚詣西南梵氣天君西南諸靈官九幽之中拔贖罪魂一十二日一十二夜明燈燒香首謝天君西南諸靈官可得開度長夜之中見諸光明一十二年皆得還生福慶之門西方世界飛天神人曰西方無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功滿德報巳得道者位登上真未得道者名書太素玄臺命過升天為太上之賓西方白帝皆列名七氣之天七氣天君告下西方三官九署地牢之中削落白元九幽玉匱長夜之函宿世罪根素天司命勒録諸天神仙簿中七祖普離三塗五苦上升金闕受福自然逍遙福堂歡樂無窮後生人中得為人尊三界所敬鬼神所稱輪轉福緣皆得神仙太上道君顧問西極世界飛天神人曰我嘗歷觀諸天出遊西門見西方無極世界長夜之中九幽地獄及三何九江諸山責役男女鬼魂流曵三塗五苦備嬰斯人宿對緣何而來而充此罰如此之例幾年之中可得解脫復有何功可得拔度西極世界飛天神人曰斯人宿身所行不道七氣天君西方諸靈官三界主司結其罪録依玄都女青方宮隂官律萬劫當得還生邊夷之國有人之形無人之情轉輪七萬劫白帝數周乃得作西嶽都役使此之悠悠勤苦難言欲使開度還入善緣當依明真玉匱女青右宮科品以白紋之繪七十尺亦可七尺金龍一枚詣西方七氣天君西方諸靈官九幽之中拔贖罪根七日七夜明燈燒香首謝天君可得開度見諸光明七年皆得還生善人之門西北世界飛天神人曰西北無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功滿德報巳得道者位登上真未得道者名書九天命過升天與五帝周旋黃帝皆列言梵氣之天梵氣天君告下西北三官九署地牢之中削落黃元九幽玉匱長夜之函宿世罪根梵天司命勒録諸天神仙簿中七祖皆得去離五道上升九天受福無窮後生人中勇猛精進威制五方因緣不絶得補五帝真人太上道君顧問西北世界飛天神人曰我嘗歷觀諸天出遊西北門見西北無極世界地獄之中九江長夜寒氷夜庭有百姓子男女人塗炭流曵身形楚撻苦毒難言如此比例被責幾年當得解脫蒙赦之日為還人中復作何形如未開恕有何功德可相拔度西北世界飛天神人曰斯人所行酷逆無度一氣天君西北諸靈官三界主司結其罪簿依玄都女青太隂宮水官律萬劫當得生愚暗之中聾盲六疾非復人形輪轉五道一十二萬劫無數之周乃得補長河都役使此之悠悠勤苦難言欲使開度還入善門當依明真玉匱女青太隂宮科品以黃紋之繪百二十尺亦可一十二尺金龍一枚詣西北一氣天君西北諸靈官九幽之中拔贖罪魂一十二日一十二夜眀燈燒香首謝天君可得開度見諸光明一十二年便得自在更生人中還入善緣之門世世歡樂長享無窮北方世界飛天神人曰北方無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功德備足玄天福報名書上清或位登上聖遊行三清或命過即得為四極明公見在世上福德之中神靈敬護萬災不干北方地司皆列言上宮五氣天君告下北方三官九府百二十曹削落玄元九幽玉匱長夜之函宿世罪根玄天司命勒録諸天神仙簿中七祖普得上升天堂衣食自然五年皆得更生帝王之門輪轉福德故恆居善緣太上道君顧問北方世界飛天神人曰我嘗歷觀諸天出遊北門見北方無極世界地獄之中三河九江諸山責役百姓子男女人塗炭流曵負山擔石閉塞長源吞火噉炭無復身形其人受對被責幾年應得解脫解脫之日為還人中復作何身中復可得拔度與不北方世界飛天神人曰斯人生世酷逆無道五氣天君北方諸靈宫三界主司結其罪録依玄都女青太陽宮火官律萬劫當生六畜之中輪轉五道五萬劫玄天數周乃得補北嶽都役使其對悠悠難可卒還欲使開度速見命根當依明真玉匱女青太陽宮科品以玄紋之繪五十尺亦可五尺金龍一枚詣五氣天君北方諸靈官九幽之中拔贖罪魂五日五夜明燈燒香首謝天君可得開度見諸光明五年身皆還生善緣之中東北世界飛天神人曰東北無極世界恆沙衆生巳得道過去及未得道見在福中善男子善女人修奉智慧上品十戒功成德報巳得道者位登上真未得道者見在世上為三界所敬地祇所畏死升天堂靈人交遊東北地司皆列言梵氣之天梵氣天君告下東北三官九府百二十曹削落黃元九幽玉匱長夜之函宿世罪根梵天司命勒録諸天神仙簿中九祖升度南宮去離五道逍遙福堂五年皆得還生福德之門世世因緣享福無窮太上道君顧問東北世界飛天神人曰我嘗歷觀諸天出遊東北門見東北無極世界地獄之中有百姓子男女人身受宿對諸苦備經流曵塗炭無復人形其人何辜生世何犯殺害何命致受今對當作何功拔贖罪身使得還入善道之中東北世界飛天神人曰斯人前生不念慈心三春遊獵張羅布網放火燒山刺射野獸殺害衆生其罪深重死受殃罰身負捶打萬痛交行驅馳百極食息無寧欲拔比罪還於福中當依明真科品以黃紋之繪百二十尺亦可一十二尺金龍一杖以詣東北梵氣天君東北諸靈官九幽之府拔贖罪魂一十二日一十二夜燒香然燈照耀諸天地獄之中使長徒幽魂得見光明罪根披散還入福門魂升南宮受慶自然下方世界飛天神人曰下方無極世界恆沙衆生巳得道地仙五嶽真人及未得道見在福中善男子善女人修奉智慧上品十戒功成德滿巳得道者位登上真未得道者名書諸天命過之日徑升福堂東華宮中五嶽五帝皆列言諸天三十二天帝君告下八極三官九署地牢之中削落九幽玉匱長夜之函宿世罪根諸天司命勒録金格神仙簿中七祖皆得去離地役升上南宮後生人中富貴之門積功勤修輪轉不倦尅得飛行上升太極位得神仙太上道君顧問下方無極世界飛天神人曰我嘗歷觀下方出遊八極見下方無極世界地獄之中有百姓子男女人身受酷對大小相牽塗炭八極囚徒之中其人何辜生世何犯違何經法受此之對當作何功可得拔贖宿愆使得更生人道之中下方世界飛天神人曰斯人前世不敬鬼神不信經教犯忤地祇五嶽四瀆罪非可紀死受酷罰幽沈地獄自非明真科法拔度萬劫無原夫欲開度當以黃紋之繪三十二尺金龍一枚以詣下方諸土府五嶽名山諸水三官九署十二河源九幽之中拔贖罪魂一日一夜一十二時燒香然燈照耀諸地之下九幽之內使長徒死魂得見光明身受開度還入福門上方世界飛天神人曰上方三十二天無極世界恆沙衆生巳得道上聖髙神諸真人及未得道見在福中有百姓子男女人修奉智慧上品十戒功成德滿巳得道者位登上真未得道者名書三十二天命過之日徑升福堂逍遙三界大羅之上諸天右别九幽之府長夜之中削除罪簡拔出七祖升上南宮更生人中修行善道世世因緣玩好不絶尅得神仙飛行三界大羅之天太上道君顧問上方世界飛天神人曰我嘗歷觀上方三十二天遊行三界見天一北獄青詔上獄及三河積夜之府有百姓子男女人祼身赤肉不得衣食身被鐵杖痛苦難任流曵三河漣汲洪水以灌四瀆晝夜勤苦無有休息其人生世何所犯違觸何經戒而受此對當作何功德可以拔贖使得更生還在人中上方世界飛天神人曰其人前身不信大法疑毀經文違犯十戒致受今對充天徒責自非明真科品拔度萬劫無還夫欲開度常以青紋之繒三十二尺金龍一枚以詣諸天宮曹府拔贖宿對開度九幽之中囚徒死魂一日一夜一十二時燒香然燈照耀諸天積夜之河九幽之中使責役之鬼得見光明身受開度還入福門太上道君歡喜作禮上白天尊今日侍坐得聞十方飛天神人説諸罪根拔度上品生者得度死者得還九幽之內普受光明來生男女善心信向當得其福世世因緣玩好不絶身得神仙香燈供養門戶興隆三界侍衛萬靈朝門鬼試降伏千災不干大法開化萬劫無窮福慶堂堂巍巍難勝欣諸來生得此大恩不勝喜悅而作頌曰是時諸天一時稱善
