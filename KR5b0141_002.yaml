body:
  text: 太上智慧長樂頌龍漢多純民混心皆自然五情不爭競形有不死神龍門斷長河三塗不役人休息五道場罷除刀劒山蕩蕩元漢內九幽無苦魂不聞哭尸聲但聞長樂言不見長夜鬼但見飛天仙斯世樂何樂故誦興樂篇諸天稽首慶同稱慶劫年玄都七寶林十天普彌羅紫煙觀靈暉雲景秀玉阿上有福德堂宮室互參差皆是清信士真仙飛天家三界通玄路五道清不邪善根應緣生纍功享福多牽對相尋續大法諒不虛無有萬年人皆與劫同徂依依歡樂世發言成慶歌此世觀無極當奈來運何太上道君於洞陽館柏陵舍中受戒見諸天福堂億劫種親並逍遙無為衣食自然身有光明飛仙同侶無有憂戚不知苦難見之悲喜故作長樂頌篇太上智慧苦神頌生落苦神界輪轉五道庭九幽閉長夜纍劫無光明刀山多劒樹毒刃互崢嶸不見羣鳥集但聞苦魂聲回風搖長條哀響流寒庭上有履山人時刻無暫停飢食曲泉炭渴飲冶火精流曵三塗中豈識形與名念爾不知命苦哉傷人情罪福各生緣善惡諒由心輪轉不終滅譬聲不絶音九幽有元録萬劫自相尋寒氷無極源長夜間重隂不見福德舍但見窮鬼林長河難閉塞苦魂攀領吟孤聲赴絶劒哀號落刀岑此形非復形痛哉傷人襟太上道君出遊八門見諸地獄幽閉重檻及三河九江刀山劒樹囚徒餓鬼責役死魂流曵塗炭無復身形不可忍見見之悲傷故作苦神頌篇天尊告太上道君曰今日普與十方至真無極大聖衆同生一劫歡樂難譬言不覺盡心不覺現説諸善惡禁戒科律無所藏隱諸天同慶齊宣法音普度無量今生何幸遇此經教自發善心命得長年不橫夭傷終歸之日徑上天堂因緣無絶皆得道真吾念來生末世男女皆當隨運自從心迫情急不覺生罪罪根當生淪於五道一跌信路無復還期往返三塗五苦之中刀山劒樹飛血萬里無極寒氷窮魂填夜號咷長河悲吟傷人哀此不幸往不能還今故説是經為諸來生信向之人開通津梁普令得去惡對之根身入光明還於善緣至心宗奉當得其福不信向者當獲其殃吾過去後其文當還大羅之上七寶玄臺紫微宫中如明真玄科四萬劫當行下世教度天人今以相告明識之焉是時衆聖太上道君歡喜作禮稽首而退太上洞玄靈寶智慧罪根上品大戒經卷下
